# AeroSpace: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2
start-at-login = true
auto-reload-config = true

# dwindle.sh and retile.sh rely on both (they're the defaults)
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Keyboard focus pulls the cursor into the window (only if it's outside).
# No focus-follows-mouse: hovering focused the tiles behind a fullscreen window and kicked you out.
on-focus-changed = ['move-mouse window-lazy-center']

persistent-workspaces = ['Q', 'W', 'E', 'R', 'T', 'A', 'S', 'D', 'F', 'B', 'C', 'Z', 'X', 'L', 'O']

# Focus ring around the focused window (JankyBorders): macOS's own keyboard-focus color
# (#1AA9FF at 50%), following each window's real corner radius. Here it's built from
# source into ~/.local/bin because Homebrew won't build it next to Xcode 16.
after-startup-command = [
    'exec-and-forget PATH="$HOME/.local/bin:$PATH" borders style=round width=3.0 hidpi=on active_color=0x7f1aa9ff inactive_color=0x00000000',
]

# 8pt like macOS's own tiling margins, so the 3pt focus ring has room to breathe
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

[workspace-to-monitor-force-assignment]
# Top row + L, O go to the second monitor; everything else falls back to main
Q = 'secondary'
W = 'secondary'
E = 'secondary'
R = 'secondary'
T = 'secondary'
L = 'secondary'
O = 'secondary'

# Callbacks run top to bottom; the first match wins.

# Utilities and tools float instead of taking a tile
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com.apple.(systempreferences|calculator|archiveutility)|com.superduper.superwhisper|us.zoom.xos|cc.ffitch.shottr|so.cap.desktop|com.unity3d.unityhub)$"'
run = 'layout floating'

# Game launchers and emulators
[[on-window-detected]]
if = 'test %{app-bundle-id} ~= "^(com.valvesoftware.steam|com.jagex.launcher|com.mojang.minecraftlauncher|net.pcsx2.pcsx2|org.ppsspp.ppsspp|org.love2d.love)$" || test %{app-name} = Balatro'
run = 'layout floating'

# Any app's own settings window
[[on-window-detected]]
if = 'test %{window-title} ~= "^(settings|preferences)$"'
run = 'layout floating'

# AeroSpace forgets which workspace each window was on when it (re)starts.
# Send these apps home then; windows opened later stay where you are.
[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'app.zen-browser.zen' }
run = 'move-node-to-workspace A'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'com.openai.codex' }
run = 'move-node-to-workspace S'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'com.anthropic.claudefordesktop' }
run = 'move-node-to-workspace C'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'com.mitchellh.ghostty' }
run = 'move-node-to-workspace W'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'com.google.Chrome' }
run = 'move-node-to-workspace E'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'com.tinyspeck.slackmacgap' }
run = 'move-node-to-workspace Z'

[[on-window-detected]]
if = { during-aerospace-startup = true, app-id = 'rocks.spotifast.Spotifast' }
run = 'move-node-to-workspace X'

# Everything else: split the neighbour instead of adding yet another column
[[on-window-detected]]
if.during-aerospace-startup = false
run = 'exec-and-forget ~/.dotfiles/aerospace/dwindle.sh'

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-period = 'fullscreen'
alt-equal = 'balance-sizes'

# alt-l is workspace L, so focus left wraps around to reach the right side
alt-h = 'focus --wrap-around left'
alt-j = 'focus down'
alt-k = 'focus up'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'

alt-n = 'resize smart -200'
alt-m = 'resize smart +200'
alt-shift-n = 'resize smart -50'
alt-shift-m = 'resize smart +50'

# Pressing the current workspace's key again jumps back to the previous one
alt-q = 'workspace --auto-back-and-forth Q'
alt-w = 'workspace --auto-back-and-forth W'
alt-e = 'workspace --auto-back-and-forth E'
alt-r = 'workspace --auto-back-and-forth R'
alt-t = 'workspace --auto-back-and-forth T'
alt-a = 'workspace --auto-back-and-forth A'
alt-s = 'workspace --auto-back-and-forth S'
alt-d = 'workspace --auto-back-and-forth D'
alt-f = 'workspace --auto-back-and-forth F'
alt-b = 'workspace --auto-back-and-forth B'
alt-c = 'workspace --auto-back-and-forth C'
alt-z = 'workspace --auto-back-and-forth Z'
alt-x = 'workspace --auto-back-and-forth X'
alt-l = 'workspace --auto-back-and-forth L'
alt-o = 'workspace --auto-back-and-forth O'

alt-shift-q = 'move-node-to-workspace --focus-follows-window Q'
alt-shift-w = 'move-node-to-workspace --focus-follows-window W'
alt-shift-e = 'move-node-to-workspace --focus-follows-window E'
alt-shift-r = 'move-node-to-workspace --focus-follows-window R'
alt-shift-t = 'move-node-to-workspace --focus-follows-window T'
alt-shift-a = 'move-node-to-workspace --focus-follows-window A'
alt-shift-s = 'move-node-to-workspace --focus-follows-window S'
alt-shift-d = 'move-node-to-workspace --focus-follows-window D'
alt-shift-f = 'move-node-to-workspace --focus-follows-window F'
alt-shift-b = 'move-node-to-workspace --focus-follows-window B'
alt-shift-c = 'move-node-to-workspace --focus-follows-window C'
alt-shift-z = 'move-node-to-workspace --focus-follows-window Z'
alt-shift-x = 'move-node-to-workspace --focus-follows-window X'
alt-shift-l = 'move-node-to-workspace --focus-follows-window L'
alt-shift-o = 'move-node-to-workspace --focus-follows-window O'

alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['exec-and-forget ~/.dotfiles/aerospace/retile.sh', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
