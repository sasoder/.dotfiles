# A trailing hash-bang comment adds the binding to uosc's right-click menu with its
# shortcut shown. Key `#` = menu-only item, `---` = separator, `>` = submenu.

o                script-binding uosc/open-file            #! Open file…
Ctrl+v           script-binding uosc/paste                #! Paste URL, magnet or path
Meta+v           script-binding uosc/paste
h                script-binding memo-history              #! Recently watched
#                                                         #! ---

c                script-binding uosc/chapters             #! Chapters
n                add chapter 1                            #! Next chapter
N                add chapter -1                           #! Previous chapter
Alt+i            script-binding chapter_skip/toggle-auto  #! Auto-skip intros & credits
Alt+p            script-binding uosc/items                #! Playlist
#                                                         #! ---

Alt+s            script-binding uosc/subtitles            #! Subtitles > Choose track
Alt+d            script-binding uosc/download-subtitles   #! Subtitles > Download…
#                script-binding uosc/load-subtitles       #! Subtitles > Load from file…
#                                                         #! Subtitles > ---
Alt+k            add sub-scale 0.1                        #! Subtitles > Bigger
Alt+j            add sub-scale -0.1                       #! Subtitles > Smaller
v                cycle sub-visibility                     #! Subtitles > Show / hide
u                cycle-values sub-ass-override force scale #! Subtitles > Use the file's own styling
#                                                         #! Subtitles > ---
z                add sub-delay -0.1                       #! Subtitles > Show earlier (0.1s)
x                add sub-delay +0.1                       #! Subtitles > Show later (0.1s)
Ctrl+Shift+LEFT  sub-step -1                              #! Subtitles > Sync: previous line starts now
Ctrl+Shift+RIGHT sub-step 1                               #! Subtitles > Sync: next line starts now
Ctrl+LEFT        no-osd sub-seek -1                       #! Subtitles > Jump to previous line
Ctrl+RIGHT       no-osd sub-seek 1                        #! Subtitles > Jump to next line

Alt+a            script-binding uosc/audio                #! Audio > Choose track
Alt+n            script-binding night_mode/toggle         #! Audio > Night mode
m                cycle mute                               #! Audio > Mute
#                script-binding uosc/audio-device         #! Audio > Output device

Alt+q            script-binding uosc/stream-quality       #! Video > Stream quality
s                async screenshot                         #! Video > Screenshot to Desktop
S                async screenshot video                   #! Video > Screenshot without subtitles
#                cycle-values panscan 1 0                 #! Video > Fill screen (crop black bars)
#                set video-aspect-override no             #! Video > Aspect ratio > Original
#                set video-aspect-override 16:9           #! Video > Aspect ratio > 16:9
#                set video-aspect-override 2.35:1         #! Video > Aspect ratio > 2.35:1
#                set video-aspect-override 4:3            #! Video > Aspect ratio > 4:3
b                cycle deband                             #! Video > Debanding

]                multiply speed 1.1                       #! Playback > Faster
[                multiply speed 1/1.1                     #! Playback > Slower
BS               set speed 1.0                            #! Playback > Normal speed
l                ab-loop                                  #! Playback > A-B loop
L                cycle-values loop-file inf no            #! Playback > Loop this file
#                                                         #! ---

Alt+o            script-binding uosc/show-in-directory    #! Show in Finder
?                script-binding uosc/keybinds             #! Search all shortcuts
Q                quit-watch-later                         #! Quit and remember position

MBTN_RIGHT       script-binding uosc/menu
TAB              script-binding uosc/flash-ui
Alt+t            script-binding webtorrent/toggle-info
