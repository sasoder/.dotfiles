# ── Playback ────────────────────────────────────────────────
save-position-on-quit
watch-later-options-remove=volume,mute
write-filename-in-watch-later-config
resume-playback-check-mtime
autocreate-playlist=same           # open one episode → rest of the folder is queued
keep-open=yes                      # pause on the last frame instead of closing
force-window=immediate             # show the window while URLs/torrents load

# ── Window / UI (uosc draws the controls) ───────────────────
osc=no
osd-bar=no
geometry=50%:50%
autofit-larger=90%x90%
autofit-smaller=40%x40%
cursor-autohide=1000

osd-font="DIN Alternate"
osd-font-size=30
osd-border-size=2
osd-duration=1500

# ── Video ───────────────────────────────────────────────────
profile=high-quality
hwdec=auto-safe
deband=yes
# smooth 24fps panning on 60/120Hz screens (frame blending, no soap-opera effect)
video-sync=display-resample
interpolation
tscale=oversample

# ── Audio ───────────────────────────────────────────────────
volume-max=150
audio-file-auto=fuzzy
audio-normalize-downmix=yes        # 5.1 → stereo without clipping

# ── Subtitles ───────────────────────────────────────────────
slang=en,eng,English
sub-auto=fuzzy                     # pick up "Movie.en.srt", "Movie.English.srt", …
sub-file-paths=subs:Subs:subtitles:Subtitles
sub-fix-timing=yes
demuxer-mkv-subtitle-preroll=yes   # subs show immediately after seeking

sub-ass-override=force             # `u` toggles back to the file's own ASS styling
sub-font="Avenir Next Demi Bold"
sub-font-size=36
sub-color="#B3FFEE8C"              # #AARRGGBB → 70% opaque pale yellow
sub-border-size=1.2
sub-border-color="#000000"
sub-shadow-offset=1
sub-shadow-color="#66000000"

# ── Screenshots ─────────────────────────────────────────────
screenshot-dir=~~desktop/
screenshot-template="%F - %wH.%wM.%wS"
screenshot-format=png

# ── Streaming / cache ───────────────────────────────────────
cache=yes
demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
ytdl-format=bv*[height<=2160]+ba/b

[extension.gif]
loop-file=inf
