# Only overrides; defaults: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf

# Theme: warm near-black glass with the subtitle yellow as accent
color=foreground=ffee8c,foreground_text=17150f,background=141413,background_text=f2efe6,curtain=000000,success=a5e075,error=ff6b6b,match=ffd24d,heatmap=ffee8c
opacity=timeline=0.35,position=1,chapters=0.9,slider=0.5,slider_gauge=0.85,controls=0,speed=0.4,menu=0.94,submenu=0.6,title=0,tooltip=0.94,curtain=0.55,pause_indicator=0.7
border_radius=10
text_border=1.4
refine=text_width

# Timeline: slim filled accent bar (controls-backdrop.lua draws the gradient behind it)
timeline_style=bar
timeline_size=26
timeline_border=0
progress=windowed
progress_size=3
chapter_ranges=openings:ffee8c40,endings:ffee8c40,ads:ff6b6b66

# Control bar: playback + chapters left, tracks, speed centred, tools right.
# Every button has a hover tooltip naming its shortcut.
controls=menu,gap,play-pause,<has_chapter>command:skip_previous:add chapter -1?Previous chapter  ·  N,<has_chapter>command:skip_next:add chapter 1?Next chapter  ·  n,gap,<has_chapter>command:bookmark:script-binding uosc/chapters#chapters>0?Chapters  ·  c,<video,audio>command:subtitles:script-binding uosc/subtitles#sub>0?Subtitles  ·  Alt+s,<has_many_audio>command:graphic_eq:script-binding uosc/audio#audio>1?Audio  ·  Alt+a,<stream>command:high_quality:script-binding uosc/stream-quality?Quality  ·  Alt+q,space,<video,audio>speed,space,<has_chapter>cycle:fast_forward:auto_skip@chapter_skip:no/yes!?Auto-skip intros  ·  Alt+i,<video,audio>cycle:bedtime:night_mode@night_mode:no/yes!?Night mode  ·  Alt+n,command:history:script-binding memo-history?Recently watched  ·  h,gap,<has_playlist>command:arrow_back_ios:script-binding uosc/prev?Previous file,<has_playlist>command:list_alt:script-binding uosc/items?Playlist  ·  Alt+p,<has_playlist>command:arrow_forward_ios:script-binding uosc/next?Next file,gap,fullscreen
controls_size=34
controls_margin=10
controls_spacing=4

# Title + current chapter top-left, like Disney+/Netflix
top_bar=always
top_bar_controls=no
top_bar_flash_on=video,audio,chapter

menu_item_height=36
menu_min_width=320
menu_padding=8

autoload=no
default_directory=~/Downloads
use_trash=yes
languages=slang,en
