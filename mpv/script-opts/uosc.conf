# Only overrides; defaults: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf
# scripts/uosc/elements/Menu.lua carries small local patches (grep "dotfiles:"),
# re-apply them after updating uosc.

# Monochrome glass. Colour is left to the video and the subtitles.
color=foreground=ffffff,foreground_text=000000,background=141414,background_text=ffffff,curtain=000000,success=ffffff,error=ff6b6b,match=ffffff,heatmap=ffffff
opacity=timeline=0.28,position=0.95,chapters=0.6,slider=0.22,slider_gauge=0.9,controls=0,speed=0.4,menu=0.9,submenu=0.5,title=0,tooltip=0.9,curtain=0.45,thumbnail=1,pause_indicator=0.6
border_radius=6
text_border=0
refine=text_width

timeline_style=bar
timeline_size=18
timeline_border=0
timeline_cache=no
progress=windowed
progress_size=3
chapter_ranges=openings:ffffff1a,endings:ffffff1a,ads:ffffff1a

# Transport on the left, everything else behind subtitles, chapters and more on the right.
controls=play-pause,<has_chapter>command:skip_previous:add chapter -1?Previous chapter,<has_chapter>command:skip_next:add chapter 1?Next chapter,space,<has_many_audio>command:translate:script-binding uosc/audio?Audio,<video,audio>command:subtitles:script-binding uosc/subtitles?Subtitles,<has_chapter>command:format_list_bulleted:script-binding uosc/chapters?Chapters,command:more_horiz:script-binding uosc/menu?More,cycle:fullscreen:fullscreen:no/yes=fullscreen_exit?Fullscreen
controls_size=30
controls_margin=14
controls_spacing=10

volume_size=28

# Title is drawn by controls-backdrop.lua instead
top_bar=never

menu_item_height=38
menu_min_width=300
menu_padding=6

autoload=no
default_directory=~/Downloads
use_trash=yes
languages=slang,en
